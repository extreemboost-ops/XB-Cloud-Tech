    <rect x="0" y="0" width="1792" height="120" rx="16" fill="url(#cardGrad)" stroke="#1E293B" stroke-width="2" filter="url(#cardShadow)" />
    
    <text x="40" y="52" fill="#FFFFFF" font-family="system-ui, -apple-system, sans-serif" font-size="32" font-weight="800" letter-spacing="-0.5">Storex ERP • Multi-Counter Retail POS Terminal</text>
    <text x="40" y="90" fill="#94A3B8" font-family="system-ui, -apple-system, sans-serif" font-size="18" font-weight="500">Counter #01 • Shift #04 • Cashier: Ahmed R.</text>

    <!-- Top Right Status in Header -->
    <rect x="1560" y="36" width="190" height="48" rx="12" fill="#070A14" stroke="#1E293B" stroke-width="1.5" />
    <circle cx="1588" cy="60" r="6" fill="#10B981" />
    <text x="1608" y="65" fill="#10B981" font-family="monospace" font-size="14" font-weight="bold">SYSTEM ACTIVE</text>

