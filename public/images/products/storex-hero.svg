          <text x="40" y="82" fill="#64748B" font-family="monospace" font-size="14">SKU: TR-5520</text>

          <text x="560" y="62" fill="#93C5FD" font-family="system-ui, -apple-system, sans-serif" font-size="18" font-weight="600">SKU: TR-5520</text>

          <text x="1080" y="62" fill="#E2E8F0" font-family="monospace" font-size="19" font-weight="bold">1 @ Rs. 3,200</text>

          <text x="1460" y="52" fill="#38BDF8" font-family="monospace" font-size="22" font-weight="800">Rs. 3,200</text>
          
