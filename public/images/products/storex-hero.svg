    <!-- Bottom Verification Watermark -->
    <g transform="translate(0, 850)">
      <text x="40" y="30" fill="#64748B" font-family="monospace" font-size="14">XB CLOUD TECH • ENTERPRISE SAAS SUITE • ORIGINAL SYSTEM CAPTURE</text>
      <text x="1750" y="30" fill="#64748B" font-family="monospace" font-size="14" text-anchor="end">4K ULTRA HD • 1920 × 1080</text>
    </g>
  </g>
</svg>