          <text x="32" y="46" fill="#94A3B8" font-family="monospace" font-size="14" font-weight="bold" letter-spacing="1">TODAY&APOS;S GROSS SALES</text>
          <text x="32" y="98" fill="#FFFFFF" font-family="system-ui, -apple-system, sans-serif" font-size="34" font-weight="800">Rs. 284,500</text>
          <rect x="490" y="32" width="36" height="36" rx="8" fill="#0B5FFF" fill-opacity="0.15" />
          <circle cx="508" cy="50" r="6" fill="#00D4FF" />
        </g>
      
        <g transform="translate(616, 0)">
