<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1080" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0A0F1E" />
      <stop offset="50%" stop-color="#0E162B" />
      <stop offset="100%" stop-color="#080C17" />
    </linearGradient>
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#0B5FFF" />
      <stop offset="100%" stop-color="#00D4FF" />
    </linearGradient>
    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#141E38" stop-opacity="0.9" />
      <stop offset="100%" stop-color="#0F172C" stop-opacity="0.9" />
    </linearGradient>
    <filter id="cardShadow" x="-5%" y="-5%" width="110%" height="115%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#000000" flood-opacity="0.5" />
    </filter>
  </defs>

  <!-- Background Canvas -->
  <rect width="1920" height="1080" fill="url(#bgGrad)" />

  <!-- Subtle Ambient Glow -->
  <circle cx="960" cy="180" r="600" fill="#0B5FFF" opacity="0.08" filter="blur(80px)" />
  <circle cx="1600" cy="800" r="500" fill="#00D4FF" opacity="0.06" filter="blur(90px)" />

  <!-- Window Chrome Header -->
  <rect x="0" y="0" width="1920" height="72" fill="#070A14" />
  <line x1="0" y1="72" x2="1920" y2="72" stroke="#1E293B" stroke-width="2" />

  <!-- Window Controls -->
  <circle cx="48" cy="36" r="10" fill="#EF4444" opacity="0.85" />
  <circle cx="78" cy="36" r="10" fill="#F59E0B" opacity="0.85" />
  <circle cx="108" cy="36" r="10" fill="#10B981" opacity="0.85" />

  <!-- Chrome Address Bar -->
  <rect x="180" y="16" width="600" height="40" rx="8" fill="#111827" stroke="#1F2937" stroke-width="1.5" />
  <circle cx="204" cy="36" r="5" fill="#10B981" />
  <text x="224" y="41" fill="#94A3B8" font-family="system-ui, -apple-system, sans-serif" font-size="15" font-weight="600">https://app.xbcloudtech.com/storex-hero</text>

  <!-- Badge Top Right -->
  <rect x="1620" y="18" width="240" height="36" rx="18" fill="#0B5FFF" fill-opacity="0.2" stroke="#0B5FFF" stroke-opacity="0.5" />
  <text x="1740" y="42" fill="#00D4FF" font-family="system-ui, -apple-system, sans-serif" font-size="13" font-weight="bold" text-anchor="middle" letter-spacing="1.5">RETAIL POS ENGINE</text>

  <!-- Main Work Area Container -->
  <g transform="translate(64, 110)">
