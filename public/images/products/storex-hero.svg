          <line x1="0" y1="110" x2="1792" y2="110" stroke="#1A243D" stroke-width="1.5" />
          
          <text x="40" y="52" fill="#FFFFFF" font-family="system-ui, -apple-system, sans-serif" font-size="20" font-weight="700">Casual Leather Belt (Black)</text>
          <text x="40" y="82" fill="#64748B" font-family="monospace" font-size="14">SKU: AC-1029</text>

          <text x="560" y="62" fill="#93C5FD" font-family="system-ui, -apple-system, sans-serif" font-size="18" font-weight="600">SKU: AC-1029</text>

          <text x="1080" y="62" fill="#E2E8F0" font-family="monospace" font-size="19" font-weight="bold">1 @ Rs. 950</text>

          <text x="1460" y="52" fill="#38BDF8" font-family="monospace" font-size="22" font-weight="800">Rs. 950</text>
          
          <rect x="1620" y="32" width="130" height="34" rx="8" fill="#10B981" fill-opacity="0.15" stroke="#10B981" stroke-opacity="0.4" />
          <text x="1685" y="54" fill="#34D399" font-family="system-ui, -apple-system, sans-serif" font-size="13" font-weight="bold" text-anchor="middle">Scanned</text>
        </g>
      
        <g transform="translate(0, 394)">
          <rect x="0" y="0" width="1792" height="110" fill="#0B1020" opacity="0.6" />
          <line x1="0" y1="110" x2="1792" y2="110" stroke="#1A243D" stroke-width="1.5" />
          
          <text x="40" y="52" fill="#FFFFFF" font-family="system-ui, -apple-system, sans-serif" font-size="20" font-weight="700">Cotton Crew Socks 3-Pack</text>
          <text x="40" y="82" fill="#64748B" font-family="monospace" font-size="14">SKU: SC-304</text>

          <text x="560" y="62" fill="#93C5FD" font-family="system-ui, -apple-system, sans-serif" font-size="18" font-weight="600">SKU: SC-304</text>

          <text x="1080" y="62" fill="#E2E8F0" font-family="monospace" font-size="19" font-weight="bold">2 @ Rs. 650</text>

          <text x="1460" y="52" fill="#38BDF8" font-family="monospace" font-size="22" font-weight="800">Rs. 1,300</text>
          
          <rect x="1620" y="32" width="130" height="34" rx="8" fill="#10B981" fill-opacity="0.15" stroke="#10B981" stroke-opacity="0.4" />
          <text x="1685" y="54" fill="#34D399" font-family="system-ui, -apple-system, sans-serif" font-size="13" font-weight="bold" text-anchor="middle">Scanned</text>
        </g>
      
